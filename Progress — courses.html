<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses - EduMind AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif} .tab-active{background:#2563eb;color:white} .card-hover{transition:.2s} .card-hover:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-[#f8fafc] text-slate-900">
<header class="bg-white sticky top-0 z-50 border-b"><div class="max-w-[1280px] mx-auto px-4 h-[68px] flex items-center gap-6">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white text-xl">🧠</div><div class="leading-none font-extrabold text-[19px]">EduMind<br>AI</div></div>
<nav class="hidden lg:flex gap-5 text-[15px] text-slate-600 flex-1"><a href="index.html">Dashboard</a><a href="recommendations.html">AI Recommendations</a><a href="#" class="text-blue-600 font-medium">My Courses</a><a href="#" class="text-blue-600 font-medium">Progress</a></nav>
<div class="flex gap-2 ml-auto"><div class="bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full text-[13px] font-semibold">🔥 0 day streak</div><div class="bg-yellow-100 text-yellow-800 px-3 py-1.5 rounded-full text-[13px] font-semibold">⭐ <span id="pts">0</span> pts</div></div>
</div></header>

<main class="max-w-[1280px] mx-auto px-4 py-5 space-y-5">
<!-- PROGRESS HEADER -->
<section class="bg-white rounded-2xl border p-5 grid md:grid-cols-4 gap-4">
<div><p class="text-slate-500 text-sm">Overall Progress</p><p class="text-[28px] font-extrabold">68%</p><div class="h-2 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="h-full bg-blue-600" style="width:68%"></div></div></div>
<div class="text-center bg-blue-50 rounded-xl p-3"><p class="text-2xl font-bold text-blue-600">12</p><p class="text-xs text-slate-500">Enrolled Courses</p></div>
<div class="text-center bg-green-50 rounded-xl p-3"><p class="text-2xl font-bold text-green-600">8</p><p class="text-xs text-slate-500">Completed</p></div>
<div class="text-center bg-purple-50 rounded-xl p-3"><p class="text-2xl font-bold text-purple-600">4</p><p class="text-xs text-slate-500">Certificates</p></div>
</section>

<!-- TABS -->
<div class="flex gap-2 overflow-x-auto">
<button onclick="filterCourses('all',this)" class="tab-btn tab-active px-5 py-2 rounded-full border font-semibold whitespace-nowrap">All Courses</button>
<button onclick="filterCourses('progress',this)" class="tab-btn px-5 py-2 rounded-full border font-semibold bg-white whitespace-nowrap">In Progress</button>
<button onclick="filterCourses('completed',this)" class="tab-btn px-5 py-2 rounded-full border font-semibold bg-white whitespace-nowrap">Completed</button>
<button onclick="filterCourses('favorites',this)" class="tab-btn px-5 py-2 rounded-full border font-semibold bg-white whitespace-nowrap">⭐ Favorites</button>
</div>

<!-- SEARCH -->
<input id="search" oninput="renderCourses()" placeholder="🔍 Search courses... e.g. Computer Vision" class="w-full border rounded-full px-5 py-3 bg-white outline-none focus:border-blue-500">

<!-- GRID -->
<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<!-- ACHIEVEMENTS -->
<section class="bg-white rounded-2xl border p-5"><h3 class="font-bold text-[18px]">🏆 Achievements</h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4" id="badges"></div></section>
</main>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full text-sm hidden z-50"></div>
<script>
let filter='all';
const courses=[
{icon:'🧮',title:'Algebra: Linear Equations',cat:'Mathematics',prog:75,status:'progress',lessons:'12/16 lessons',time:'15 min left',color:'bg-blue-500'},
{icon:'💻',title:'Computer Vision: LBP & Filtering',cat:'Computer Science',prog:60,status:'progress',lessons:'6/10 lessons',time:'20 min left',color:'bg-purple-500'},
{icon:'📊',title:'Python for Data Science',cat:'Data Science',prog:40,status:'progress',lessons:'8/20 lessons',time:'30 min left',color:'bg-orange-500'},
{icon:'🔬',title:'Physics: Mechanics',cat:'Science',prog:100,status:'completed',lessons:'10/10 lessons',time:'Completed',color:'bg-green-500'},
{icon:'📚',title:'English Grammar',cat:'English',prog:100,status:'completed',lessons:'15/15 lessons',time:'Completed',color:'bg-pink-500'},
{icon:'🧠',title:'AI & Machine Learning Basics',cat:'AI',prog:20,status:'progress',lessons:'2/10 lessons',time:'45 min left',color:'bg-indigo-500'},
];
function renderCourses(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let list=courses.filter(c=>(filter==='all'||c.status===filter||(filter==='favorites'&&c.prog>=60))&&c.title.toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=list.map((c,i)=>`<div class="bg-white border rounded-2xl overflow-hidden card-hover"><div class="${c.color} h-[110px] flex items-center justify-center text-[52px]">${c.icon}</div><div class="p-4"><div class="flex justify-between"><span class="bg-slate-100 text-xs px-2 py-1 rounded-full font-semibold">${c.cat}</span><span class="text-xs font-semibold ${c.status==='completed'?'text-green-600':'text-blue-600'}">${c.status==='completed'?'✅ Completed':'▶ In Progress'}</span></div><p class="font-bold mt-2">${c.title}</p><p class="text-slate-500 text-sm">${c.lessons} • ${c.time}</p><div class="flex items-center gap-2 mt-3"><div class="h-2 bg-slate-100 rounded-full flex-1 overflow-hidden"><div class="h-full ${c.prog===100?'bg-green-500':'bg-blue-600'}" style="width:${c.prog}%"></div></div><span class="text-xs font-bold">${c.prog}%</span></div><button onclick="continueCourse('${c.title}')" class="mt-3 w-full ${c.prog===100?'bg-green-600':'bg-blue-600'} text-white py-2.5 rounded-full font-semibold text-sm">${c.prog===100?'View Certificate 🏆':'Continue →'}</button></div></div>`).join('')||'<p class="col-span-3 text-center text-slate-500 py-8">No courses found.</p>';
}
function filterCourses(f,el){filter=f;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('tab-active'));el.classList.add('tab-active');renderCourses()}
function continueCourse(t){document.getElementById('pts').textContent=parseInt(document.getElementById('pts').textContent)+10;showToast('Opening: '+t+' +10 pts')}
function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
document.getElementById('badges').innerHTML=[['🔥','7-Day Streak','Keep it up!'],['⭐','Top Learner','Top 10%'],['💻','CV Master','Finished CV'],['🏆','Course Finisher','8 courses']].map(b=>`<div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-3xl">${b[0]}</p><p class="font-bold text-sm mt-1">${b[1]}</p><p class="text-xs text-slate-500">${b[2]}</p></div>`).join('');
renderCourses();
</script></body></html>
