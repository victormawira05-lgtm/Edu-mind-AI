<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Tutors - EduMind AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif} .card-hover{transition:.2s} .card-hover:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-[#f8fafc] text-slate-900">
<header class="bg-white sticky top-0 z-50 border-b"><div class="max-w-[1280px] mx-auto px-4 h-[68px] flex items-center gap-6">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white text-xl">🧠</div><div class="leading-none font-extrabold text-[19px]">EduMind<br>AI</div></div>
<nav class="hidden lg:flex gap-5 text-[15px] text-slate-600 flex-1"><a href="index.html">Dashboard</a><a href="recommendations.html">AI Recommendations</a><a href="#" class="text-blue-600 font-medium">Subject Tutors</a><a href="calendar.html">Study Calendar</a><a href="courses.html">My Courses</a></nav>
<div class="flex gap-2 ml-auto"><div class="bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full text-[13px] font-semibold">🔥 0 day streak</div><div class="bg-yellow-100 text-yellow-800 px-3 py-1.5 rounded-full text-[13px] font-semibold">⭐ <span id="pts">0</span> pts</div></div>
</div></header>

<main class="max-w-[1280px] mx-auto px-4 py-5 space-y-5">
<section class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-[18px] p-6 text-white flex flex-col md:flex-row justify-between gap-4">
<div><h1 class="text-[28px] font-bold">👩‍🏫 Subject Tutors</h1><p class="text-blue-100">Chat with AI tutors or book a live human tutor. AI is free, live is Premium.</p>
<div class="flex gap-2 mt-3"><span class="bg-white/20 px-3 py-1 rounded-full text-sm">🤖 6 AI Tutors Online</span><span class="bg-white/20 px-3 py-1 rounded-full text-sm">👩‍🏫 12 Human Tutors</span></div></div>
<button onclick="showToast('Finding best tutor for you...')" class="bg-white text-blue-700 font-bold px-5 py-3 rounded-full self-start md:self-center">✨ Find My Tutor</button>
</section>

<!-- FILTER -->
<div class="flex gap-2 overflow-x-auto">
<button onclick="filterTutor('all',this)" class="t-btn bg-blue-600 text-white px-5 py-2 rounded-full font-semibold whitespace-nowrap">All</button>
<button onclick="filterTutor('AI',this)" class="t-btn bg-white border px-5 py-2 rounded-full font-semibold whitespace-nowrap">🤖 AI Tutors</button>
<button onclick="filterTutor('Human',this)" class="t-btn bg-white border px-5 py-2 rounded-full font-semibold whitespace-nowrap">👩‍🏫 Human Tutors</button>
<button onclick="filterTutor('Free',this)" class="t-btn bg-white border px-5 py-2 rounded-full font-semibold whitespace-nowrap">🆓 Free</button>
</div>
<input id="search" oninput="renderTutors()" placeholder="🔍 Search tutor... e.g. Computer Vision, Algebra" class="w-full border rounded-full px-5 py-3 bg-white outline-none focus:border-blue-500">

<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<!-- CHAT MODAL -->
<div id="chatModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-4">
<div class="bg-white w-full max-w-[480px] rounded-[20px] overflow-hidden">
<div class="p-4 flex gap-3 border-b"><div id="modalAvatar" class="w-11 h-11 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl">🤖</div><div class="flex-1"><p id="modalName" class="font-bold">AI Tutor</p><p class="text-green-600 text-sm">● Online</p></div><button onclick="closeChat()" class="text-2xl">×</button></div>
<div id="chatBox" class="h-[280px] overflow-y-auto p-4 space-y-3 bg-slate-50"></div>
<div class="p-3 flex gap-2 border-t"><input id="chatInput" onkeydown="if(event.key==='Enter') sendMsg()" placeholder="Ask tutor..." class="flex-1 border rounded-full px-4 py-2.5 outline-none"><button onclick="sendMsg()" class="w-10 h-10 bg-blue-600 text-white rounded-full">💬</button></div>
</div></div>
</main>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full text-sm hidden z-50"></div>
<script>
let filter='all', currentTutor=null;
const tutors=[
{type:'AI',name:'Nova - Maths AI',subject:'Mathematics • Algebra',avatar:'🧮',rating:4.9,students:'12k',price:'Free',online:true,desc:'Linear equations, calculus, statistics. Answers in seconds.',color:'bg-blue-500'},
{type:'AI',name:'Pixel - CV AI',subject:'Computer Vision • BCE 211',avatar:'💻',rating:5.0,students:'8k',price:'Free',online:true,desc:'LBP, Filtering, YOLO, Segmentation. Your exam expert.',color:'bg-purple-500'},
{type:'AI',name:'Data - Python AI',subject:'Data Science • Python',avatar:'📊',rating:4.8,students:'10k',price:'Free',online:true,desc:'Pandas, NumPy, ML, visualization. With code examples.',color:'bg-orange-500'},
{type:'Human',name:'Ms. Wanjiru',subject:'Mathematics • Physics',avatar:'👩‍🏫',rating:4.9,students:'240',price:'KSh 500 / hr',online:true,desc:'Zetech lecturer. 8 yrs experience. Speaks English & Swahili.',color:'bg-green-500'},
{type:'Human',name:'Mr. Otieno',subject:'Computer Science • CV',avatar:'👨‍🏫',rating:4.8,students:'180',price:'KSh 800 / hr',online:false,desc:'Ex-Google. Teaches Computer Vision & ML projects.',color:'bg-indigo-500'},
{type:'Human',name:'Ms. Achieng',subject:'English • Communication',avatar:'👩‍🏫',rating:4.9,students:'320',price:'KSh 400 / hr',online:true,desc:'Essay, grammar, presentation skills for Data Science.',color:'bg-pink-500'},
];
function renderTutors(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let list=tutors.filter(t=>(filter==='all'||t.type===filter||(filter==='Free'&&t.price==='Free'))&&(t.name+t.subject).toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=list.map((t,i)=>`<div class="bg-white border rounded-2xl p-5 card-hover"><div class="flex gap-3"><div class="w-14 h-14 ${t.color} rounded-2xl flex items-center justify-center text-3xl shrink-0">${t.avatar}</div><div class="flex-1"><div class="flex justify-between"><p class="font-bold">${t.name}</p><span class="${t.online?'bg-green-100 text-green-700':'bg-slate-100 text-slate-500'} text-xs px-2 py-1 rounded-full h-fit font-semibold">${t.online?'● Online':'○ Offline'}</span></div><p class="text-slate-500 text-sm">${t.subject}</p><p class="text-sm mt-1">⭐ ${t.rating} • ${t.students} students • <b>${t.price}</b></p></div></div><p class="text-slate-600 text-sm mt-3">${t.desc}</p><div class="flex gap-2 mt-4"><button onclick="openChat(${tutors.indexOf(t)})" class="flex-1 bg-blue-600 text-white py-2.5 rounded-full font-semibold text-sm">💬 Chat Now</button><button onclick="bookTutor('${t.name}')" class="flex-1 border py-2.5 rounded-full font-semibold text-sm">📅 Book Session</button></div></div>`).join('')||'<p class="col-span-3 text-center text-slate-500 py-8">No tutors found.</p>';
}
function filterTutor(f,el){filter=f;document.querySelectorAll('.t-btn').forEach(b=>{b.className='t-btn bg-white border px-5 py-2 rounded-full font-semibold whitespace-nowrap'});el.className='t-btn bg-blue-600 text-white px-5 py-2 rounded-full font-semibold whitespace-nowrap';renderTutors()}
function openChat(idx){currentTutor=tutors[idx];document.getElementById('modalName').textContent=currentTutor.name;document.getElementById('modalAvatar').textContent=currentTutor.avatar;document.getElementById('chatBox').innerHTML=`<div class="bg-white border rounded-2xl p-3 text-sm max-w-[90%]">Hi! I'm ${currentTutor.name}. How can I help you today? 😊</div>`;document.getElementById('chatModal').classList.remove('hidden')}
function closeChat(){document.getElementById('chatModal').classList.add('hidden')}
function sendMsg(){let inp=document.getElementById('chatInput');let v=inp.value.trim();if(!v) return;let box=document.getElementById('chatBox');box.innerHTML+=`<div class="bg-blue-600 text-white rounded-2xl p-3 text-sm max-w-[90%] ml-auto w-fit">${v}</div>`;inp.value='';setTimeout(()=>{let r=currentTutor.subject.includes('Vision')?"For LBP: neighbour >= centre = 1 else 0. Start top-right clockwise. Example centre 4 -> 23. Want practice?":currentTutor.subject.includes('Maths')?"Linear: 2x + 6 = 0 -> x = -3. Want 3 more?":"Great question! Let's break it down step by step. What part is confusing?";box.innerHTML+=`<div class="bg-white border rounded-2xl p-3 text-sm max-w-[90%]">${r}</div>`;box.scrollTop=box.scrollHeight},600);box.scrollTop=box.scrollHeight}
function bookTutor(n){document.getElementById('pts').textContent=parseInt(document.getElementById('pts').textContent)+5;showToast('📅 Session booked with '+n+'! Check Study Calendar.')}
function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
renderTutors();
</script></body></html>
